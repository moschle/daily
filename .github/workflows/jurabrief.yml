name: Jurabrief

on:
  schedule:
    - cron: '0 5 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jurabrief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Senden
        env:
          PYTHONPATH: ${{ github.workspace }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JURABRIEF_TO: ${{ secrets.JURABRIEF_TO }}
        run: python jurabriefe/generate_jurabrief.py
      - name: State
        run: |
          git config user.name "Jurabrief Bot"
          git config user.email "jurabrief@users.noreply.github.com"
          git add jurabriefe/state.json
          git diff --cached --quiet || git commit -m "jurabrief state $(date -u +%Y-%m-%d)"
          git push
