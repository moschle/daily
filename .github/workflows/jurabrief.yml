name: Jurabrief

on:
  schedule:
    # Dreimal anklopfen: geplante Laeufe werden von GitHub oft um Stunden
    # verzoegert oder fallen aus. Die Tagessperre in generate_jurabrief.py
    # sorgt dafuer, dass nur der erste tatsaechlich ausgefuehrte Lauf sendet.
    - cron: '23 1 * * 1,3,5'
    - cron: '23 3 * * 1,3,5'
    - cron: '23 6 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

# Zwei Laeufe duerfen sich nie ueberlappen, sonst liest der zweite den State,
# bevor der erste ihn geschrieben hat.
concurrency:
  group: jurabrief
  cancel-in-progress: false

jobs:
  jurabrief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhaengigkeiten
        run: pip install -r requirements.txt
      - name: Senden
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/jurabriefe
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JURABRIEF_TO: ${{ secrets.JURABRIEF_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python jurabriefe/generate_jurabrief.py
      - name: State
        run: |
          git config user.name "Jurabrief Bot"
          git config user.email "jurabrief@users.noreply.github.com"
          git add jurabriefe/state.json jurabriefe/progress.json jurabriefe/karten/
          git diff --cached --quiet || git commit -m "jurabrief state $(date -u +%F)"
          git pull --rebase --autostash
          git push
