name: Morgenbrief

on:
  schedule:
    # Ziel: Zustellung bis 06:00 MESZ
    # GH Actions hat ~30-60 Min. Delay + Workflow ~5 Min.
    # 03:00 UTC = 05:00 MESZ → mit Delay ca. 05:30-06:00
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  morgenbrief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Morgenbrief generieren und senden
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ICAL_URL: ${{ secrets.ICAL_URL }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python run_morgenbrief.py

      - name: Persistente Dateien committen
        run: |
          git config user.name "Morgenbrief Bot"
          git config user.email "morgenbrief@users.noreply.github.com"
          git add vocab_memory.json discovery_albums.json || true
          git diff --cached --quiet || git commit -m "data: $(date +%Y-%m-%d)"
          git push || true
