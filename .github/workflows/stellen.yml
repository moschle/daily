name: Stellen-Monitor

on:
  schedule:
    # 07:30 UTC = 09:30 MESZ — nach dem Morgenbrief, vor dem Tag
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  stellen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stellen-Check ausführen
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          STELLEN_RECIPIENT: ${{ secrets.STELLEN_RECIPIENT }}
        run: python stellen_boot.py

      - name: State committen
        run: |
          git config user.name "Stellen Bot"
          git config user.email "stellen@users.noreply.github.com"
          git add stellen_seen.json || true
          git diff --cached --quiet || git commit -m "stellen-state: $(date +%Y-%m-%d)"
          git push || true
