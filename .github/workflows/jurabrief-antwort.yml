name: Jurabrief-Korrektur

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  korrektur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Auswerten
        env:
          PYTHONPATH: ${{ github.workspace }}/jurabriefe
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JURABRIEF_TO: ${{ secrets.JURABRIEF_TO }}
        run: python jurabriefe/korrektur.py
      - name: Progress
        run: |
          git config user.name "Jurabrief Bot"
          git config user.email "jurabrief@users.noreply.github.com"
          git add jurabriefe/progress.json
          git diff --cached --quiet || git commit -m "jurabrief korrektur $(date -u +%F)"
          git pull --rebase --autostash
          git push
